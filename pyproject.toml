[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "hermes-voice"
dynamic = ["version"]
description = "Voice-enabled personal assistant for Hermes Agent. Open mic with wake word, fully local — no API keys, no accounts, 35 languages."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["hermes-agent", "voice-assistant", "speech-to-text", "text-to-speech",
            "wake-word", "portuguese", "pt-br", "whisper", "piper", "vad"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Base minima: transcreve, conversa e fala com Piper. Tudo local.
dependencies = [
  "faster-whisper>=1.1,<2",
  "sounddevice>=0.4.6,<0.6",
  "numpy>=1.24,<3",
  "httpx>=0.27,<0.29",
  "onnxruntime>=1.17,<2",
  "silero-vad>=5.1,<6",
]

[project.optional-dependencies]
# Palavra de ativacao. Apache-2.0, sem conta.
wake    = ["openwakeword>=0.6,<0.7"]
# Kokoro via ONNX: pesos Apache-2.0, sem PyTorch.
kokoro  = ["kokoro-onnx>=0.4,<1"]
# Piper como pacote Python. O wheel falha com frequencia no Windows; nesse caso
# o binario baixado por 'hermes-voice voices' cobre o caso.
piper   = ["piper-tts>=1.2,<2; sys_platform != 'win32'"]
# Push-to-talk. Instala hook global de teclado -- ver SECURITY.md.
ptt     = ["pynput>=1.7,<2"]
# Sintese por referencia. ATENCAO: pesos do XTTS-v2 sao non-commercial e
# arrastam PyTorch (~2,5 GB). Ver docs/VOICE_LICENSING.md.
xtts    = ["coqui-tts>=0.24,<1"]
dev     = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
all     = ["hermes-voice[wake,kokoro,piper,ptt]"]

[project.scripts]
hermes-voice = "hermes_voice.cli:main"

[project.urls]
Homepage      = "https://github.com/handnewb/hermes-voice"
Repository    = "https://github.com/handnewb/hermes-voice"
Issues        = "https://github.com/handnewb/hermes-voice/issues"
Changelog     = "https://github.com/handnewb/hermes-voice/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/hermes_voice/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_voice"]
artifacts = ["src/hermes_voice/data/*.md"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["hermes_voice"]
omit = ["*/loops.py", "*/cli.py", "*/audio.py", "*/tts/speaker.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "ARG"]
ignore = [
  "N818",    # nomes de excecao sem sufixo Error
  "RUF001",  # caracteres unicode ambiguos: os docstrings sao em portugues
  "RUF002",
  "RUF003",
  "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.10"
files = ["src/hermes_voice"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
